<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Furiyomi ふりよみ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Furiyomi <span class="sub">ふりよみ</span></h1>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-view="read" aria-selected="true">閱讀</button>
      <button type="button" role="tab" data-view="vocab" aria-selected="false">單字庫</button>
      <button type="button" role="tab" data-view="stats" aria-selected="false">統計</button>
    </nav>
  </header>

  <main>
    <div id="view-read" class="view">
      <section class="input-area">
        <textarea id="text-input" placeholder="在這裡貼上日文文章…" lang="ja"></textarea>
        <div class="input-bar">
          <span id="char-count">0 / 20,000</span>
          <div class="actions">
            <label id="pdf-btn" class="button secondary">上傳 PDF<input id="pdf-input" type="file" accept=".pdf,application/pdf" hidden></label>
            <button id="analyze-btn" type="button">標註假名</button>
          </div>
        </div>
        <p id="message" class="message" hidden></p>
      </section>

      <div id="reader" class="reader" hidden>
        <section class="article-area">
          <div class="toolbar">
            <label><input id="ruby-toggle" type="checkbox" checked> 顯示假名</label>
            <label><input id="color-toggle" type="checkbox" checked> 詞性上色</label>
            <ul class="legend">
              <li class="pos-noun">名詞</li>
              <li class="pos-verb">動詞</li>
              <li class="pos-adjective">形容詞</li>
              <li class="pos-adverb">副詞</li>
              <li class="pos-auxiliary">助動詞</li>
              <li class="pos-particle">助詞</li>
            </ul>
          </div>
          <div id="article" class="article" lang="ja"></div>
          <nav id="pager" class="pager" hidden>
            <button id="prev-btn" type="button">上一頁</button>
            <span id="page-info"></span>
            <button id="next-btn" type="button">下一頁</button>
          </nav>
          <p class="hint">點一下單字看詳情；按住 Shift 再點同一句的另一個字，可選取整段。</p>
        </section>

        <aside id="detail" class="detail">
          <p id="detail-empty" class="detail-empty">點選文章中的單字，這裡會顯示詳情。</p>
          <dl id="detail-body" hidden>
            <dt>表記</dt><dd id="d-surface" class="big" lang="ja"></dd>
            <dt>讀音</dt><dd id="d-reading" lang="ja"></dd>
            <dt>原形</dt><dd id="d-lemma" lang="ja"></dd>
            <dt>詞性</dt><dd id="d-pos" lang="ja"></dd>
          </dl>
          <div id="ai-area" class="ai-area" hidden>
            <button id="ai-btn" type="button">AI 解釋</button>
            <p id="ai-message" class="message" hidden></p>
            <dl id="ai-result" hidden>
              <dt>中文意思</dt><dd id="ai-meaning"></dd>
              <dt>用法</dt><dd id="ai-usage"></dd>
              <dt>例句</dt><dd id="ai-example-ja" lang="ja"></dd><dd id="ai-example-zh" class="translation"></dd>
            </dl>
          </div>
          <div id="collect-area" class="collect-area" hidden>
            <button id="collect-btn" class="button secondary" type="button">加入單字庫</button>
            <p id="collect-message" class="message" hidden></p>
          </div>
        </aside>
      </div>
    </div>

    <div id="view-vocab" class="view" hidden>
      <div class="vocab-toolbar">
        <input id="vocab-search" type="search" placeholder="搜尋原形、讀音、中文意思">
        <select id="vocab-pos">
          <option value="">全部詞性</option>
          <option>名詞</option>
          <option>代名詞</option>
          <option>動詞</option>
          <option>形容詞</option>
          <option>形状詞</option>
          <option>副詞</option>
          <option>連体詞</option>
          <option>接続詞</option>
          <option>感動詞</option>
          <option>助動詞</option>
          <option>接頭辞</option>
          <option>接尾辞</option>
        </select>
        <span id="vocab-count"></span>
      </div>
      <p id="vocab-message" class="message" hidden></p>
      <div class="table-wrap">
        <table class="vocab-table">
          <thead>
            <tr><th>原形</th><th>讀音</th><th>詞性</th><th>中文意思與原句</th><th>收藏時間</th><th></th></tr>
          </thead>
          <tbody id="vocab-body"></tbody>
        </table>
      </div>
      <p id="vocab-empty" class="hint" hidden></p>
    </div>

    <div id="view-stats" class="view" hidden>
      <p id="stats-message" class="message" hidden></p>
      <div class="stat-tiles">
        <div class="stat-tile">
          <div class="stat-label">單字庫總數</div>
          <div id="stat-vocab-total" class="stat-value">—</div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">本週新增</div>
          <div id="stat-vocab-week" class="stat-value">—</div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">累計查詢</div>
          <div id="stat-lookups" class="stat-value">—</div>
        </div>
      </div>

      <div class="chart-grid">
        <section class="chart-card">
          <h2>詞性分布</h2>
          <p class="chart-sub">單字庫中各詞性的單字數</p>
          <div id="pos-chart" class="hbar-chart"></div>
          <p id="pos-empty" class="hint" hidden>單字庫還沒有單字。</p>
        </section>

        <section class="chart-card">
          <h2>近 14 天查詢數</h2>
          <p class="chart-sub">每天按「AI 解釋」的次數（命中快取也算）</p>
          <div id="daily-chart" class="col-chart"></div>
          <details class="table-view">
            <summary>以表格檢視</summary>
            <table>
              <thead><tr><th>日期</th><th>查詢數</th></tr></thead>
              <tbody id="daily-table"></tbody>
            </table>
          </details>
        </section>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
